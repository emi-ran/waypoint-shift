name: Signed Android Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release source
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected a vMAJOR.MINOR.PATCH tag"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main

      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          chmod +x gradlew

      - name: Run tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --continue

      - name: Build signed release
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!name}" || { echo "Missing secret: $name"; exit 1; }
          done
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/waypoint-release.p12"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64
          ./gradlew --no-daemon --no-configuration-cache assembleRelease lintRelease

      - name: Verify signing identity and prepare assets
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/signature.txt"
          grep -Fqi 'Signer #1 certificate SHA-256 digest: 41ebaa0c78d0bf28f7bbde827d8083f5e9dec3dd30ec36370893db377e1cfc4c' "$RUNNER_TEMP/signature.txt"
          mkdir -p dist
          cp "$APK" "dist/waypoint-shift-$RELEASE_TAG.apk"
          cd dist
          sha256sum "waypoint-shift-$RELEASE_TAG.apk" > "waypoint-shift-$RELEASE_TAG.apk.sha256"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: waypoint-shift-signed-release
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/waypoint-release.p12"

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results*.html
            app/build/reports/lint-results*.xml
          retention-days: 7
